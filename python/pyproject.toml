[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel2-prepare"
version = "0.1.0"
description = "Prepare Sentinel-2 L2A bands for PolyHok analysis"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<2.4",
  "pillow>=11,<13",
  "rasterio>=1.4,<1.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
sentinel2-prepare = "sentinel2_prepare.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
